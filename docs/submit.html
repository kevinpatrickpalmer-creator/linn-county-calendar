<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Submit a Community Event</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f5f2;
    color: #1a1a1a;
    padding: 1.25rem;
    display: flex;
    justify-content: center;
  }
  main {
    width: 100%;
    max-width: 480px;
  }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 .25rem;
  }
  p.sub {
    margin: 0 0 1.5rem;
    color: #555;
    font-size: .95rem;
  }
  form {
    background: #fff;
    border-radius: 12px;
    padding: 1.25rem;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
  }
  label {
    display: block;
    font-weight: 600;
    font-size: .9rem;
    margin: 1rem 0 .35rem;
  }
  label:first-of-type { margin-top: 0; }
  input, textarea, select {
    width: 100%;
    padding: .65rem .7rem;
    font-size: 1rem;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-family: inherit;
    background: #fff;
  }
  textarea { resize: vertical; min-height: 5rem; }
  .row { display: flex; gap: .75rem; }
  .row > div { flex: 1; }
  button {
    width: 100%;
    margin-top: 1.5rem;
    padding: .85rem;
    font-size: 1.05rem;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    background: #a71a2d;
    color: #fff;
    cursor: pointer;
  }
  button:disabled { opacity: .6; }
  #status {
    margin-top: 1rem;
    font-size: .95rem;
    text-align: center;
  }
  #status.ok { color: #1a7d3c; }
  #status.err { color: #a71a2d; }
  .hp { position: absolute; left: -9999px; }
  .hint { margin: .35rem 0 0; font-size: .8rem; color: #666; line-height: 1.4; }
  .hint.err { color: #a71a2d; font-weight: 600; }
  @media (prefers-color-scheme: dark) {
    body { background: #15151a; color: #eee; }
    form { background: #202027; box-shadow: none; }
    input, textarea, select { background: #15151a; color: #eee; border-color: #444; }
    p.sub { color: #aaa; }
    .hint { color: #999; }
    .hint.err { color: #ff6b6b; }
  }
</style>
<!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "d925775715eb4a179876e0e5c75e0dda"}'></script><!-- End Cloudflare Web Analytics -->
</head>
<body>
<main>
  <h1>Submit a Community Event</h1>
  <p class="sub" id="pageSub">Add your event to the community calendar. A person reviews every submission before it goes live — you won't see it on the calendar immediately.</p>

  <form id="eventForm">
    <label for="name">Event name *</label>
    <input id="name" name="name" type="text" maxlength="120" required>

    <div class="row">
      <div>
        <label for="date">Date *</label>
        <input id="date" name="date" type="date" required>
      </div>
      <div>
        <label for="time">Time (optional)</label>
        <input id="time" name="time" type="time">
      </div>
    </div>

    <label for="town">Town *</label>
    <select id="town" name="town" required>
      <option value="" disabled selected>Select a town</option>
    </select>

    <label for="venue">Venue / address (optional)</label>
    <input id="venue" name="venue" type="text" maxlength="120" placeholder="e.g. City Park, or the school gym">

    <label for="description">Description (optional)</label>
    <textarea id="description" name="description" maxlength="500" placeholder="A sentence or two about the event"></textarea>

    <label for="contact_email">Your contact email</label>
    <input id="contact_email" name="contact_email" type="email" maxlength="150" placeholder="you@example.com">

    <label for="contact_phone">Your contact phone</label>
    <input id="contact_phone" name="contact_phone" type="tel" maxlength="30" placeholder="(555) 555-5555">
    <p class="hint" id="contactHint">At least one is required. This will be shown on the calendar listing so people with questions about the event can reach you.</p>

    <!-- Honeypot: real visitors never see or fill this in; bots often do. -->
    <input class="hp" type="text" name="botcheck" tabindex="-1" autocomplete="off">

    <button type="submit" id="submitBtn">Submit event</button>
    <div id="status" role="status"></div>
  </form>
</main>

<script>
(async function () {
  const config = await (await fetch("config.json")).json();

  document.title = `Submit a Community Event — ${config.county_display_name}`;
  document.getElementById("pageSub").textContent =
    `Add your event to the ${config.county_display_name} community calendar. A person reviews every submission before it goes live — you won't see it on the calendar immediately.`;

  const townSelect = document.getElementById("town");
  for (const town of config.towns) {
    const option = document.createElement("option");
    option.value = town;
    option.textContent = town;
    townSelect.appendChild(option);
  }

  const form = document.getElementById("eventForm");
  const statusEl = document.getElementById("status");
  const submitBtn = document.getElementById("submitBtn");
  const contactHint = document.getElementById("contactHint");

  function formatTime12h(value) {
    if (!value) return "";
    const [h, m] = value.split(":").map(Number);
    const period = h >= 12 ? "pm" : "am";
    const hour12 = ((h + 11) % 12) + 1;
    return `${hour12}:${String(m).padStart(2, "0")} ${period}`;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    statusEl.textContent = "";
    statusEl.className = "";

    const contactEmail = document.getElementById("contact_email").value.trim();
    const contactPhone = document.getElementById("contact_phone").value.trim();
    if (!contactEmail && !contactPhone) {
      contactHint.classList.add("err");
      contactHint.textContent = "Please provide an email or phone number so we can reach you with questions.";
      document.getElementById("contact_email").focus();
      return;
    }
    contactHint.classList.remove("err");
    contactHint.textContent = "At least one is required. This will be shown on the calendar listing so people with questions about the event can reach you.";

    submitBtn.disabled = true;
    submitBtn.textContent = "Submitting...";

    const data = new FormData(form);

    // Capture raw values before anything gets reformatted for display below --
    // these are what admin.html's own inputs expect (native <input type=date/time>
    // values), used to build a one-click pre-filled review link.
    const rawName = (data.get("name") || "").trim();
    const rawDate = data.get("date") || "";
    const rawTime = data.get("time") || "";
    const town = (data.get("town") || "").trim();
    const venue = (data.get("venue") || "").trim();
    const rawDescription = (data.get("description") || "").trim();

    const adminParams = new URLSearchParams({
      name: rawName,
      date: rawDate,
      time: rawTime,
      town,
      venue,
      description: rawDescription,
      // admin.html combines these into one editable "contact" field, which
      // gets appended to the event's description -- so this does end up
      // visible on the public calendar listing (that's the point).
      contact_email: contactEmail,
      contact_phone: contactPhone,
    });
    const adminLink = `https://${config.domain}/admin.html?${adminParams.toString()}`;

    data.append("access_key", config.web3forms_access_key);
    data.append("subject", `New event submission: ${rawName}`);
    data.append("from_name", `${config.calendar_title} — Event Submission`);
    // Human-friendly time for the email itself, since Web3Forms just relays
    // whatever we send -- separate from rawTime, which stays HH:MM for the link.
    data.set("time", formatTime12h(rawTime));

    // Combine into the same "Venue | Town, ST" shape the scraped events use,
    // so reminder filtering by town works the same way for both.
    data.append("location", venue && town ? `${venue} | ${town}, ${config.state}` : town ? `${town}, ${config.state}` : "");
    data.append("review_and_approve_link", adminLink);

    try {
      const res = await fetch("https://api.web3forms.com/submit", {
        method: "POST",
        headers: { Accept: "application/json" },
        body: data,
      });
      const result = await res.json();

      if (result.success) {
        statusEl.textContent = "Thanks! Your event was submitted for review.";
        statusEl.className = "ok";
        form.reset();
      } else {
        throw new Error(result.message || "Submission failed");
      }
    } catch (err) {
      statusEl.textContent = "Something went wrong submitting your event. Please try again in a moment.";
      statusEl.className = "err";
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Submit event";
    }
  });
})();
</script>
</body>
</html>
