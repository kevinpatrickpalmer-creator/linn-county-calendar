name: Test Brevo send

on:
  workflow_dispatch:
    inputs:
      test_to:
        description: "Recipient email"
        required: true
      test_from:
        description: "Sender email (must be an authenticated/verified sender in Brevo)"
        required: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Send test email
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          TEST_TO: ${{ inputs.test_to }}
          TEST_FROM: ${{ inputs.test_from }}
        run: python test_brevo_send.py
