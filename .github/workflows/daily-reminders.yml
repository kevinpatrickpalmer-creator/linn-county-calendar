name: Send daily event reminders

on:
  schedule:
    - cron: "0 13 * * *"  # ~8am Central (drifts to 7am during standard time)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install icalendar requests

      - name: Send reminders
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: python send_reminders.py
