name: Update lost & found

on:
  push:
    branches: [main]
    paths:
      - "data/lost-found/**"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-lost-found
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build docs/lost-found.json
        run: python build_lost_found_directory.py

      - name: Commit updated lost & found file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/lost-found.json
          git diff --cached --quiet || git commit -m "Update lost & found"
          git push
