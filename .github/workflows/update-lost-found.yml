name: Update lost & found

on:
  push:
    branches: [main]
    paths:
      - "data/lost-found/**"
  workflow_dispatch: {}
  # Posts expire by age (see load_posts() in build_lost_found_directory.py),
  # not just on a new submission -- this reruns the build daily so a
  # post actually drops off the site once it's stale, even during a
  # lull with nothing new coming in.
  schedule:
    - cron: "0 13 * * *"

permissions:
  contents: write

concurrency:
  group: update-lost-found
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build docs/lost-found.json
        run: python build_lost_found_directory.py

      - name: Commit updated lost & found file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/lost-found.json
          git diff --cached --quiet || git commit -m "Update lost & found"
          git push
