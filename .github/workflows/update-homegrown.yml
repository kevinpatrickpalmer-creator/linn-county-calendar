name: Update homegrown directory

on:
  push:
    branches: [main]
    paths:
      - "data/homegrown/**"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-homegrown
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build docs/homegrown.json
        run: python build_homegrown_directory.py

      - name: Commit updated homegrown file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/homegrown.json
          git diff --cached --quiet || git commit -m "Update homegrown directory"
          git push
