name: Update jobs bulletin

on:
  push:
    branches: [main]
    paths:
      - "data/jobs/**"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-jobs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build docs/jobs.json
        run: python build_jobs_directory.py

      - name: Commit updated jobs file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/jobs.json
          git diff --cached --quiet || git commit -m "Update jobs bulletin"
          git push
