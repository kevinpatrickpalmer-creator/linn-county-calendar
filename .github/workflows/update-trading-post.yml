name: Update trading post

on:
  push:
    branches: [main]
    paths:
      - "data/trading-post/**"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-trading-post
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build docs/trading-post.json
        run: python build_trading_post_directory.py

      - name: Commit updated trading post file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/trading-post.json
          git diff --cached --quiet || git commit -m "Update trading post"
          git push
