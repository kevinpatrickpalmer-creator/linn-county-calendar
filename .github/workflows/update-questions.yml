name: Update Ask the Community

on:
  push:
    branches: [main]
    paths:
      - "data/questions/**"
      - "data/answers/**"
  workflow_dispatch: {}
  # Questions expire by age (see load_questions() in
  # build_questions_directory.py), not just on a new submission -- this
  # reruns the build daily so a question actually drops off the site
  # once it's stale, even during a lull with nothing new coming in.
  schedule:
    - cron: "10 13 * * *"

permissions:
  contents: write

concurrency:
  group: update-questions
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build docs/questions.json
        run: python build_questions_directory.py

      - name: Commit updated questions file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/questions.json
          git diff --cached --quiet || git commit -m "Update Ask the Community"
          git push
