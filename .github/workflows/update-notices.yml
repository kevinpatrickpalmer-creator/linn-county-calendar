name: Update Community Notices

on:
  push:
    branches: [main]
    paths:
      - "data/notices/**"
  workflow_dispatch: {}
  # Notices expire by age (see load_notices() in
  # build_notices_directory.py), not just on a new submission -- this
  # reruns the build daily so a notice actually drops off the site once
  # it's stale, even during a lull with nothing new coming in.
  schedule:
    - cron: "15 13 * * *"

permissions:
  contents: write

concurrency:
  group: update-notices
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build docs/notices.json
        run: python build_notices_directory.py

      - name: Commit updated notices file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/notices.json
          git diff --cached --quiet || git commit -m "Update Community Notices"
          git push
