name: Update community calendar

on:
  schedule:
    - cron: "0 */4 * * *"  # every 4 hours, UTC
  workflow_dispatch: {}     # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-calendar
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Save pre-scrape calendar for diffing
        run: cp docs/linn_county_events.ics /tmp/old_events.ics 2>/dev/null || true

      - name: Run scraper
        run: python scrape_linn_county_calendar.py

      - name: Notify admin of newly-approved manual events
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: python notify_new_manual_events.py /tmp/old_events.ics docs/linn_county_events.ics

      - name: Notify admin of newly-scraped events
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: python notify_new_scraped_events.py /tmp/old_events.ics docs/linn_county_events.ics

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-artifacts
          path: |
            debug_screenshot.png
            debug_page.html
          if-no-files-found: ignore

      - name: Commit updated calendar file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/linn_county_events*.ics docs/source_status.json docs/towns/
          git diff --cached --quiet || git commit -m "Update calendar events"
          git push
